# gitleaks over the full history on every push to main and every PR, so a token
# committed by accident fails the build before it's merged. The CLI runs from
# its container image rather than gitleaks-action, which needs a license key for
# organisation-owned repositories. `--redact` keeps any match out of the log.
#
# A false positive (a test fixture that looks like a key) goes in `.gitleaksignore`
# as the fingerprint from the report. Don't weaken the rules.
name: Secret scan

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history, not only the tip

      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0="*" \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git /repo --redact --no-banner --verbose
