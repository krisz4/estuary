# nginx serves the built SPA and reverse-proxies the API on the same origin.
#
# **The proxy is the whole point of this file.** With it, the browser loads the
# app from http://localhost:5173 and calls http://localhost:5173/api/v1/... —
# one origin, so there is no CORS preflight on any request (P41 measured one
# extra round trip per write against the cross-origin dev setup) and the API's
# ALLOWED_ORIGINS is not on the container's request path at all. Port 4000 is
# still published by compose for curl and for Swagger UI, but nothing the app
# does depends on it.

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # The API disables `x-powered-by` deliberately (src/app.ts). Advertising the
  # nginx version in front of it would give the same information back.
  server_tokens off;

  # Response headers applied to everything this server block answers.
  #
  # **`add_header` does not merge across levels: a location that declares one of
  # its own inherits none of these.** Only two locations below do, and both
  # repeat this block for that reason — the duplication is the nginx rule, not an
  # oversight. `expires` is a different directive and does not suppress
  # inheritance, which is why the proxied locations need no copy.
  #
  # No CSP. Tailwind v4 injects styles and Swagger UI runs its own bundle, so a
  # policy written without a real browser in front of it is a white screen with
  # a console error — see D24.
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "DENY" always;

  # Docker's embedded DNS is resolved at request time via `$upstream`: with a
  # literal hostname in proxy_pass, nginx resolves it once at startup and caches
  # the result forever, so an API container that restarts with a new IP is
  # unreachable until nginx is restarted too.
  #
  # `api` resolves on the compose network — this hostname is used by *nginx*,
  # not by the browser, which is the one place a service name is correct.
  resolver 127.0.0.11 valid=10s ipv6=off;

  location /api/ {
    # **Deliberately above the API's own BODY_LIMIT (1mb), not equal to it.**
    # nginx's default is exactly 1m, so an over-limit body was rejected here,
    # as an HTML 413, and never reached Express — which is the one path the app
    # actually uses. `src/app.ts` mounts cors before the json parser precisely
    # so that PAYLOAD_TOO_LARGE arrives readable, with a code and an
    # `x-request-id`; that only holds if the request gets far enough for the API
    # to be the component that refuses it. Raise both together, or the envelope
    # silently stops being what a browser sees.
    client_max_body_size 2m;

    set $upstream http://api:4000;
    proxy_pass $upstream$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # The default, made explicit because it is load-bearing in the *request*
    # direction: `requestId` middleware adopts an incoming `x-request-id` when a
    # client sends one (it is in the API's `allowedHeaders`), and only mints a
    # uuid otherwise. Dropping request headers here would silently break that.
    proxy_pass_request_headers on;
  }

  # Swagger UI. `= /docs` plus `^~ /docs/` rather than a bare `location /docs`,
  # which is a prefix match and would also proxy `/docsomething`.
  location = /docs {
    set $upstream http://api:4000;
    proxy_pass $upstream$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  location ^~ /docs/ {
    set $upstream http://api:4000;
    proxy_pass $upstream$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  location = /health {
    set $upstream http://api:4000;
    proxy_pass $upstream$request_uri;
    proxy_http_version 1.1;
  }

  # Hashed assets are immutable by construction — Vite renames them on every
  # content change, so a year is safe and a reload costs nothing.
  #
  # One `Cache-Control`, written out in full: `expires 1y` emits its own
  # `max-age`, so pairing it with an `add_header Cache-Control` put two of the
  # header on every asset response.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    # Repeated because this block declares an `add_header` — see the note above.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    try_files $uri =404;
  }

  # SPA fallback. Every client route (/tickets/42, /tickets/new) is served
  # index.html so a hard refresh or a pasted link does not 404 — React Router
  # then reads the path. `=404` on /assets/ above keeps a missing bundle from
  # being answered with HTML, which would surface as a JS syntax error rather
  # than a missing file.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # index.html must never be cached: it carries the hashed asset names, and a
  # stale copy points at bundles that no longer exist. The fallback above is an
  # internal *redirect*, so it re-enters location matching and lands here.
  location = /index.html {
    add_header Cache-Control "no-cache" always;
    # Repeated because this block declares an `add_header` — see the note above.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
  }

  gzip on;
  # **`text/javascript`, not `application/javascript`.** nginx has mapped `.js`
  # to `text/javascript` in mime.types since 1.21.3, so the older spelling never
  # matched and the largest asset in the build — the JS bundle — was the one
  # thing shipped uncompressed. Both are listed so the config does not depend on
  # which mime.types the base image carries.
  gzip_types
    text/css
    text/javascript
    application/javascript
    application/json
    application/wasm
    image/svg+xml;
  gzip_min_length 1024;
}
