# Helpdesk — one command to a running, seeded app.
#
#   docker compose up --build
#
# → web on http://localhost:5173, API on http://localhost:4000,
#   Swagger UI on http://localhost:4000/docs (also proxied at /docs on 5173).
#
# The web container serves the SPA *and* proxies /api/ to the API on the same
# origin, so the browser issues no cross-origin request and no CORS preflight.
# Port 4000 is published anyway, for curl and for direct use of Swagger UI.
#
# Both published ports are bound to 127.0.0.1: without API_TOKEN the API has no
# access control, so the default all-interfaces binding would hand task CRUD to
# the LAN.

name: helpdesk

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: helpdesk-api:local
    ports:
      # **Bound to loopback, not to every interface.** Without API_TOKEN this
      # API has no access control, which is why `apps/api/env.example` ships
      # `HOST=127.0.0.1` for local development — a bare `"4000:4000"` undoes
      # exactly that, publishing full task CRUD (including DELETE) to everyone
      # on the network. Every documented use is from this machine: the browser,
      # curl, Swagger UI. To reach the stack from another device, change this
      # deliberately and know what is being exposed.
      - "127.0.0.1:4000:4000"
    environment:
      # Absolute path on the volume. A relative `file:./…` would resolve from
      # prisma/ inside the image and land on a layer the volume then shadows.
      DATABASE_URL: file:/data/helpdesk.db
      # Required in a container: the default 127.0.0.1 would bind the loopback
      # interface *inside* the namespace, and the published port would connect
      # to nothing.
      HOST: 0.0.0.0
      PORT: "4000"
      NODE_ENV: production
      # Not on the request path in this stack at all: nginx proxies /api/ on the
      # same origin, and Swagger UI is same-origin too (the OpenAPI document
      # declares `servers: [{ url: "/" }]`, so "try it out" resolves against
      # whichever origin served /docs). It is set because a web image rebuilt
      # with an absolute VITE_API_BASE_URL must keep working, and because the
      # published :4000 is there to be used directly. Both loopback spellings and
      # both ports (dev 5173, preview 4173) are listed: they are four distinct
      # origins to a browser.
      ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173,http://127.0.0.1:4173
      # Demo data on a clean volume. The entrypoint checks the task table is
      # empty first, so restarting never wipes what a reviewer added.
      SEED_ON_START: "true"
      LOG_LEVEL: info
      DOCS_ENABLED: "true"
      # Passed through from the shell (or a `.env` beside this file) so a
      # self-hoster can set them without editing the file. Empty means "use the
      # default" — lib/env.ts treats a blank value as absent. See
      # docs/engineering/ENVIRONMENT_VARIABLES.md.
      #   API_TOKEN            optional bearer gate on /api/v1 (min 16 chars)
      #   AGENTS_MAY_COMPLETE  let agent: actors move tasks to done (default false)
      #   CLAIM_LEASE_MINUTES  claim lease length (default 30)
      API_TOKEN: ${API_TOKEN:-}
      AGENTS_MAY_COMPLETE: ${AGENTS_MAY_COMPLETE:-}
      CLAIM_LEASE_MINUTES: ${CLAIM_LEASE_MINUTES:-}
    volumes:
      # Named, so the database survives `docker compose down`. `down -v` is the
      # documented way to start over.
      - helpdesk-db:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      # Migrate + seed runs before the port is bound; 63 tasks and ~180
      # comments on a cold SQLite file is well under this, and a start_period
      # means the attempts made during it do not count toward `retries`.
      start_period: 30s
    # `src/server.ts` arms a 10s force-exit timer on SIGTERM. Docker's default
    # grace is also 10s, so the two land on the same instant; 15s puts the app's
    # own last resort inside the window rather than racing SIGKILL.
    stop_grace_period: 15s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Relative → same origin → no preflights. See apps/web/Dockerfile for
        # why this is a build arg and not an environment variable.
        VITE_API_BASE_URL: /api/v1
    image: helpdesk-web:local
    ports:
      # Loopback, for the reason spelled out under the api service above.
      - "127.0.0.1:5173:80"
    depends_on:
      api:
        # nginx resolves `api` lazily per request, so this is not required for
        # correctness — it is here so the page a reviewer opens immediately
        # after `up` is backed by an API that has finished migrating.
        condition: service_healthy
    restart: unless-stopped

volumes:
  helpdesk-db:
