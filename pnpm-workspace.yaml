packages:
  - "apps/*"
  - "packages/*"

# pnpm 11 reads the build allow-list from here (it was `pnpm.onlyBuiltDependencies`
# in package.json before the rename). Prisma's postinstall downloads the query
# engine binaries — without it the client cannot connect.
allowBuilds:
  "@prisma/client": true
  "@prisma/engines": true
  # Telemetry that ships transitively with `swagger-ui-dist`. Declined on
  # purpose: it is an analytics ping, nothing depends on it having run, and
  # leaving it unlisted makes `pnpm install` exit non-zero with
  # ERR_PNPM_IGNORED_BUILDS.
  "@scarf/scarf": false
  esbuild: true
  # Declined on purpose. msw's postinstall exists solely to copy
  # `mockServiceWorker.js` into a browser app's public directory; the web tests
  # use `msw/node`, which patches the runtime's own fetch and never loads that
  # worker. Leaving it unlisted makes `pnpm install` exit non-zero with
  # ERR_PNPM_IGNORED_BUILDS, so it is listed and refused rather than omitted.
  msw: false
  prisma: true
