packages:
  - "apps/*"
  - "packages/*"

# pnpm 11 reads the build allow-list from here (it was `pnpm.onlyBuiltDependencies`
# in package.json before the rename). Prisma's postinstall downloads the query
# engine binaries — without it the client cannot connect.
allowBuilds:
  "@prisma/client": true
  "@prisma/engines": true
  # Telemetry that ships transitively with `swagger-ui-dist`. Declined on
  # purpose: it is an analytics ping, nothing depends on it having run, and
  # leaving it unlisted makes `pnpm install` exit non-zero with
  # ERR_PNPM_IGNORED_BUILDS.
  "@scarf/scarf": false
  esbuild: true
  prisma: true
